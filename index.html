
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Getform Search Box</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      text-align: center;
    }

    .search-container {
      max-width: 400px;
      margin: auto;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      margin-bottom: 10px;
    }

    button {
      padding: 12px 20px;
      font-size: 16px;
      cursor: pointer;
      background-color: #007BFF;
      color: white;
      border: none;
    }

    button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>

  <h2>Search Box Form</h2>

  <div class="search-container">
    <form action="https://getform.io/f/amdjyxvb" method="POST">
      <input type="text" name="search" placeholder="Enter search text" required />
      <button type="submit">Search</button>
    </form>
  </div>

</body>
</html>
